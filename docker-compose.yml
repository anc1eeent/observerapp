services:
  api:
    build: .
    container_name: observer_api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://observer_admin:secretpassword@db:5432/observer_db
    depends_on:
      - db
    
  db:
    image: postgres:15-alpine
    container_name: observer_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=observer_admin
      - POSTGRES_PASSWORD=secretpassword
      - POSTGRES_DB=observer_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

