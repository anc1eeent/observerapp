<!DOCTYPE HTML>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ObserverTasker - To-Do list</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
</head>

<body>
    <h1>ObserverTasker</h1>

    <div id="auth-section">
        <h2>Authentication</h2>

        <form id="register-form">
            <h3>Register</h3>
            <input type="text" id="reg-username" placeholder="Username" required minlength="3">
            <input type="password" id="reg-password" placeholder="Password" required minlength="8">
            <button type="submit">Sign Up</button>
        </form>

        <hr>

        <form id="login-form">
            <h3>Login</h3>
            <input type="text" id="login-username" placeholder="Username" required>
            <input type="password" id="login-password" placeholder="Password" required>
            <button type="submit">Sign In</button>
        </form>
    </div>

    <div id="task-section" style="display: none;">
        <h2>To-do list</h2>
        <div id="task-list"></div>
    </div>
</body>

</html>
