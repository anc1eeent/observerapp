<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ObserverTasker - Workspace</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/task.css">
    <link rel="stylesheet" href="css/profile.css">
    <link rel="stylesheet" href="css/pomodoro.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script type="module" src="js/app.js"></script>
</head>
<body>

    <div id="auth-container" class="auth-page-wrapper">
        <!-- Фоновий розмитий шар -->
        <div class="auth-bg-overlay"></div>

        <!-- Центрована картка -->
        <div class="auth-card">
            <div class="auth-visual-panel">
            <!-- Контент лівого банера -->
            </div>

            <div class="auth-forms-panel">
            <form id="login-form" class="auth-form active">
            <h2>Log In</h2>
            <div class="input-group">
                <label for="login-username">Username</label>
                <input type="text" id="login-username" required autocomplete="username">
            </div>
            <div class="input-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" required autocomplete="current-password">
            </div>
            <button type="submit" class="primary-btn">Sign In</button>
            <p class="switch-text">Don't have an account? <a href="#" id="switch-to-register">Sign up</a></p>
            </form>

            <form id="register-form" class="auth-form">
            <h2>Create an account</h2>
            <div class="input-group">
                <label for="reg-username">Username</label>
                <input type="text" id="reg-username" required minlength="3" autocomplete="username">
            </div>
            <div class="input-group">
                <label for="reg-password">Password</label>
                <input type="password" id="reg-password" required minlength="8" autocomplete="new-password">
            </div>
            <button type="submit" class="primary-btn">Create account</button>
            <p class="switch-text">Already have an account? <a href="#" id="switch-to-login">Log in</a></p>
            </form>
            </div>
        </div>
    </div>
    
    <div id="task-section" class="hidden">
        <div class="app-layout">

            <aside class="app-sidebar">
                <div class="sidebar-user-header" id="profile-trigger" title="Open Profile">
                    <div class="user-info">
                        <img src="assets/profile/user.png" alt="Avatar" class="avatar-mini">
                        <span id="sidebar-username-display" class="username-text">ancieeeent</span>
                    </div>
                    <div class="header-actions">
                        <span class="header-icon">🔍</span>
                        <span class="header-icon">✏️</span>
                    </div>
                </div>

                <nav class="sidebar-nav">
                    <ul class="nav-list top-nav">
                        <li class="nav-item placeholder"><span class="icon">📥</span> Inbox</li>
                        <li class="nav-item placeholder"><span class="icon">🎯</span> My issues</li>
                        <li class="nav-item active" id="nav-tasks-btn" data-target="tasks-view">
                            <span class="icon">💼</span> Workspace
                        </li>
                        <li class="nav-item" id="nav-pomodoro-btn" data-target="pomodoro-view">
                            <span class="icon">⏱️</span> Pomodoro
                        </li>
                    </ul>

                    <div class="nav-group">
                        <div class="nav-group-title">Your teams <span class="chevron">▼</span></div>
                        <ul class="nav-list">
                            <li class="nav-item placeholder"><span class="icon">🏠</span> Home</li>
                            <li class="nav-item placeholder"><span class="icon">📋</span> Projects</li>
                            <li class="nav-item placeholder"><span class="icon">👁️</span> Views</li>
                        </ul>
                    </div>
                </nav>

                <div class="sidebar-footer">
                    <button id="logout-btn" class="minimal-btn">Log Out</button>
                </div>
            </aside>
            <main id="main-content" class="main-workspace">
                
                <div id="tasks-view" class="spa-view">
                    <section class="task-board">
                        <header class="workspace-header">
                            <h1>Workspace <span>/</span> Active Tasks</h1>
                        </header>

                        <div class="task-input-area workspace-input">
                            <div class="input-wrapper">
                                <input type="text" id="new-task-title" placeholder="What needs to be done?" autocomplete="off" />
                                <input type="text" id="new-task-desc" placeholder="Add description..." autocomplete="off" />
                            </div>
                            <button id="add-task-btn" class="add-btn minimal-primary-btn">Save Task</button>
                        </div>

                        <div id="task-list" class="task-list">
                            <!-- Tasks will be rendered here -->
                        </div>
                    </section>
                </div>

                <div id="pomodoro-view" class="spa-view hidden pomodoro-board">
                    <div class="timer-container">
                        <div id="task-selector-container"></div>
                        <h1 id="timer-display" class="timer-display" title="Click to set time">25:00</h1>
                        <div id="timer-edit-area" class="timer-input-area hidden">
                            <input type="number" id="timer-input-minutes" min="1" max="120" value="25">
                            <span>min</span>
                            <button id="timer-set-btn" class="minimal-btn">Set</button>
                        </div>
                        <div class="timer-controls">
                            <button id="timer-start-btn" class="minimal-primary-btn">Start</button>
                            <button id="timer-pause-btn" class="minimal-btn hidden">Pause</button>
                            <button id="timer-save-btn" class="minimal-btn hidden">Save</button>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>


    <div id="profile-overlay" class="overlay hidden">
        <div class="profile-modal" style="background-color: var(--bg-sidebar); border: 1px solid var(--border-color);">
            <button id="close-profile-btn" class="close-btn" style="color: var(--text-secondary);">&times;</button>
            
            <div class="profile-content">
                <img id="profile-avatar-img" src="assets/profile/user.png" alt="User Avatar Large" class="profile-avatar-large">
                <h3 id="profile-username">Loading...</h3>
                <p id="profile-email" style="color: var(--text-muted);">No email provided</p>
            </div>

            <div class="profile-actions" id="profile-actions-container">
                <form id="profile-update-form" style="margin-bottom: 15px;">
                    <div class="input-group">
                        <input type="email" id="update-email" placeholder="New Email" style="background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-primary); padding: 8px; border-radius: 4px;">
                        <input type="text" id="update-avatar" placeholder="New Avatar URL" style="background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-primary); padding: 8px; border-radius: 4px;">
                    </div>
                    <button type="submit" class="minimal-primary-btn" style="width: 100%; margin-top: 10px;">Update Profile</button>
                    <p id="profile-error-msg" style="color: #ff5555; font-size: 12px; margin-top: 5px;"></p>
                </form>

                <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 15px 0;">

                <form id="password-update-form">
                    <div class="input-group">
                        <input type="password" id="old-password" placeholder="Current Password" required style="background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-primary); padding: 8px; border-radius: 4px;">
                        <input type="password" id="new-password" placeholder="New Password" minlength="8" required style="background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-primary); padding: 8px; border-radius: 4px;">
                    </div>
                    <button type="submit" class="minimal-primary-btn" style="width: 100%; margin-top: 10px;">Change Password</button>
                    <p id="password-error-msg" style="color: #ff5555; font-size: 12px; margin-top: 5px;"></p>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
