<!DOCTYPE HTML>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ObserverTasker - To-Do list</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/task.css">
    <link rel="stylesheet" href="css/profile.css">

    <script src="js/app.js" defer></script>
</head>

<body>

    <div id="auth-container" class="split-view">
        <div id="auth-banner">
            <h1>ObserverTasker</h1>
            <p>Get Started with Us</p>
            <p class="banner-subtext">Complete these easy steps to register your account.</p>
        </div>

        <div id="auth-form-section">
            <h2>Sign Up Account</h2>
            <p class="form-subtitle">Enter your personal data to create your account.</p>

            <form id="register-form">
                <div class="input-group">
                    <label for="reg-username">Username</label>
                    <input type="text" id="reg-username" placeholder="eg. anc1eeent" required minlength="3">
                </div>

                <div class="input-group">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" placeholder="Enter your password" required minlength="8">
                    <span class="hint">Must be at least 8 characters.</span>
                </div>

                <button type="submit" class="primary-btn">Sign Up</button>

                <p class="switch-text">Already have an account? <a href="#" id="switch-to-login">Log in</a></p>
            </form>
        </div>
    </div>

    <div id="task-section" style="display: none;">
        <div class="app-layout">
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h2>Observer</h2>
                </div>
                <ul class="nav-links">
                    <li class="active">
                        <span class="icon">📝</span> All Tasks
                    </li>
                </ul>
                <div class="sidebar-footer">
                    <button id="logout-btn" class="logout-btn">Log Out</button>
                </div>
            </aside>


            <main class="main-content">
                <header class="main-header">
    <h1>Inbox</h1>
    <div id="profile-trigger" class="profile-avatar" title="Profile">
        <img src="assets/profile/user.png" alt="User Avatar">
    </div>
</header>

                <div class="task-input-area">
                    <div class="input-wrapper">
                        <input type="text" id="new-task-title" placeholder="What needs to be done?"
                            autocomplete="off" />
                        <input type="text" id="new-task-desc" placeholder="Description (optional)" autocomplete="off" />
                    </div>
                    <button id="add-task-btn" class="add-btn">Add</button>
                </div>

                <div id="task-list" class="task-list">
                </div>
            </main>
        </div>
    </div>
    <div id="profile-overlay" class="overlay hidden">
        <div class="profile-modal">
            <button id="close-profile-btn" class="close-btn">&times;</button>
            
            <div class="profile-content">
                <img src="assets/profile/user.png" alt="User Avatar Large" class="profile-avatar-large">
                <h3 id="profile-username">Loading...</h3>
                <p id="profile-email">No email provided</p>
            </div>
            <div class="profile-actions" id="profile-actions-container">
            </div>
        </div>
    </div>
</body>

</html>
